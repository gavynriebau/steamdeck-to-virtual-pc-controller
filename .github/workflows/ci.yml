name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# What is checked is defined in scripts/check.sh (the same script a developer
# runs); each job runs one group of it. CHECK_STRICT turns a skipped check (a
# missing tool) into a failure, so CI can never pass by silently not checking.
env:
  CHECK_STRICT: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: scripts/check.sh rust

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - run: scripts/check.sh python shell
