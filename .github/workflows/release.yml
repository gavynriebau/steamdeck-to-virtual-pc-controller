name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          name="deck-virtual-controller-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name/bin"
          cp target/x86_64-unknown-linux-musl/release/deck-virtual-controller-client \
             target/x86_64-unknown-linux-musl/release/deck-virtual-controller-server "dist/$name/bin/"
          cp -r deploy deck scripts README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
