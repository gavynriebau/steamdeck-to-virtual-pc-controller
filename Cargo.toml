[workspace]
resolver = "3"
members = ["crates/common", "crates/deck", "crates/pc", "crates/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
evdev = "0.13.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
dvc-common = { path = "crates/common" }
