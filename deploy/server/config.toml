# deck-virtual-controller-server (runs on the PC)

# UDP address to listen on.
bind_addr = "0.0.0.0:24800"

# Release all inputs if the Deck goes silent for this long.
timeout_ms = 1000

# Name of the virtual gamepad that appears on the PC.
name = "Steam Deck Virtual Controller"

# Type of virtual pad:
#   "steam" - emulated 2026 Steam Controller (buttons, sticks, trackpads, gyro).
#             Needs write access to /dev/uhid (e.g. a udev rule: KERNEL=="uhid", GROUP="input", MODE="0660").
#   "xbox"  - Xbox 360 controller via uinput (buttons, sticks, triggers only).
controller_type = "steam"
